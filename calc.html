<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>月矿远征钻石计算器</title>
    <style>
        * {box-sizing: border-box; -webkit-user-select:none; user-select:none; touch-action: manipulation;}
        body {font-family: system-ui; padding:8px; margin:0; background:#f4f4f4;}
        .container {max-width:600px; margin:0 auto;}
        .cfg {margin-bottom:10px;}
        .cfg input {width:70px; padding:4px; font-size:16px}
        button {padding:6px 10px; font-size:16px; margin:2px; cursor:pointer}
        table {border-collapse: collapse; margin: 10px 0;}
        td {
            width:38px;height:38px;
            border:1px solid #999;
            text-align:center;
            font-size:14px;
            background:#eee;
        }
        td.num {background:#fff;}
        td.diamond {background:#73d073; color:#000;}
        td.empty {background:#ff7777; color:#fff;}
        td.prob {background:#fff2aa;}
    </style>
</head>
<body>
<div class="container">
    <div class="cfg">
        <div>预设地图：
            <button onclick="initBoard(8,8,20)">8×8｜20钻</button>
            <button onclick="initBoard(10,10,30)">10×10｜30钻</button>
            <button onclick="initBoard(12,12,45)">12×12｜45钻</button>
        </div>
        <div style="margin-top:4px">
            自定义：行<input id="rows" value="10">
            列<input id="cols" value="10">
            钻石总数<input id="totalDiam" value="30">
            <button onclick="initBoard()">创建</button>
            <button onclick="calcProb()">👉计算概率</button>
        </div>
    </div>
    <div>
        操作说明：
        <br>单击格子：输入相邻钻石数量；
        <br>长按格子：标记💎钻石；再次长按取消标记；
        <br>红色✕=确定无钻，绿色💎=确定钻石，黄色=概率值
        <br>✅填完全部已知数字后，点【计算概率】按钮计算
    </div>
    <table id="board"></table>
</div>
<script>
let R,C,totalDiamonds;
let grid = [];

// 初始化棋盘
function initBoard(r=+document.getElementById('rows').value, c=+document.getElementById('cols').value, td=+document.getElementById('totalDiam').value){
    R=r;C=c;totalDiamonds=td;
    grid = Array(R).fill().map(()=> Array(C).fill({type:0,val:0,prob:null}));
    render();
}

// 获取一个格子的8邻域
function getNeighbors(y,x){
    let ns=[];
    for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
            if(dy===0&&dx===0) continue;
            let ny=y+dy,nx=x+dx;
            if(ny>=0&&ny<R&&nx>=0&&nx<C) ns.push({y:ny,x:nx});
        }
    }
    return ns;
}

function render(){
    const tb = document.getElementById('board');
    tb.innerHTML = '';
    for(let y=0;y<R;y++){
        const tr = document.createElement('tr');
        for(let x=0;x<C;x++){
            const td = document.createElement('td');
            const cell = grid[y][x];
            if(cell.type===1){
                td.className = 'diamond';
                td.textContent='💎';
            }else if(cell.type===2){
                td.className = 'empty';
                td.textContent='✕';
            }else if(cell.val>0){
                td.className='num';
                td.textContent=cell.val;
            }else if(cell.prob!==null){
                td.className='prob';
                td.textContent=cell.prob.toFixed(2);
            }

            // 单击输入数字
            td.onclick = ()=>{
                if(grid[y][x].type!==0) return;
                let v = prompt('输入相邻钻石数量','0');
                v = parseInt(v);
                if(!isNaN(v)) {
                    grid[y][x].val = v;
                    grid[y][x].prob = null;
                }
                render();
            }

            // ==========修复长按滑动连续标记BUG==========
            let pressTimer = null;
            let hasTrigger = false;
            td.addEventListener('touchstart',(e)=>{
                hasTrigger = false;
                pressTimer = setTimeout(()=>{
                    hasTrigger=true;
                    toggleDiamond(y,x);
                },500);
            },{passive:true});

            td.addEventListener('touchmove',()=>{
                clearTimeout(pressTimer);
                pressTimer=null;
            },{passive:true});

            td.addEventListener('touchend',()=>{
                clearTimeout(pressTimer);
                pressTimer=null;
            });

            //电脑右键
            td.oncontextmenu = (e)=>{
                e.preventDefault();
                toggleDiamond(y,x);
            }
            tr.appendChild(td);
        }
        tb.appendChild(tr);
    }
}

function toggleDiamond(y,x){
    const cell = grid[y][x];
    if(cell.type === 1){
        cell.type = 0;
    }else if(cell.type===0){
        cell.type =1;
    }
    cell.prob=null;
    render();
}

// 带数字约束的概率计算
function calcProb(){
    //先收集所有已知标记钻石
    let markedDiamonds = 0;
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            if(grid[y][x].type===1) markedDiamonds++;
        }
    }
    const remainDiam = totalDiamonds - markedDiamonds;

    // 收集所有未知格子
    let unknownCells = [];
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            const cell = grid[y][x];
            if(cell.type===0 && cell.val===0){
                unknownCells.push({y,x});
                cell.prob=0;
            }else{
                cell.prob=null;
            }
        }
    }

    // 基础全局概率
    let baseP = remainDiam / unknownCells.length;
    for(let pos of unknownCells){
        grid[pos.y][pos.x].prob = baseP;
    }

    // 利用数字单元格做约束修正（核心，解决输入数字无效问题）
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            const cell = grid[y][x];
            if(cell.val ===0) continue;
            const neighbors = getNeighbors(y,x);
            let fixedDiam=0;
            let unknownNear=[];
            for(let n of neighbors){
                const nc = grid[n.y][n.x];
                if(nc.type===1) fixedDiam++;
                else if(nc.type===0 && nc.val===0) unknownNear.push(n);
                else if(nc.type===2) continue;
            }
            const needDiam = cell.val - fixedDiam;
            if(unknownNear.length===0) continue;
            const p = needDiam / unknownNear.length;
            for(let n of unknownNear){
                grid[n.y][n.x].prob = p;
                if(p>=1) grid[n.y][n.x].type=1;
                else if(p<=0) grid[n.y][n.x].type=2;
            }
        }
    }
    render();
}

initBoard();
</script>
</body>
</html>
