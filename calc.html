<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>月矿远征钻石计算器</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select:none;
            user-select:none;
            touch-action: manipulation;
        }
        body {font-family: system-ui; padding:8px; margin:0; background:#f4f4f4;}
        .container {max-width:600px; margin:0 auto;}
        .cfg {margin-bottom:10px;}
        .cfg input {width:70px; padding:4px; font-size:16px}
        button {padding:6px 10px; font-size:16px; margin:2px; cursor:pointer}
        table {border-collapse: collapse; margin: 10px 0;}
        td {
            width:38px;height:38px;
            border:1px solid #999;
            text-align:center;
            font-size:14px;
            background:#eee;
        }
        td.num {background:#fff;}
        td.diamond {background:#73d073; color:#000;}
        td.empty {background:#ff7777; color:#fff;}
        td.prob {background:#fff2aa;}
    </style>
</head>
<body>
<div class="container">
    <div class="cfg">
        <div>预设地图：
            <button onclick="initBoard(8,8,20)">8×8｜20钻</button>
            <button onclick="initBoard(10,10,30)">10×10｜30钻</button>
            <button onclick="initBoard(12,12,45)">12×12｜45钻</button>
        </div>
        <div style="margin-top:4px">
            自定义：行<input id="rows" value="10">
            列<input id="cols" value="10">
            钻石总数<input id="totalDiam" value="30">
            <button onclick="initBoard()">创建</button>
            <button onclick="calcProb()">👉计算概率</button>
            <button onclick="clearBoard()">🗑️清空棋盘</button>
        </div>
    </div>
    <div>
        操作说明：
        <br>单击格子：输入相邻钻石数量；
        <br>长按格子：标记💎钻石；再次长按取消标记；
        <br>双击格子：标记✕无钻石；再次双击取消标记；
        <br>红色✕=确定无钻，绿色💎=确定钻石，黄色=概率值
        <br>✅填完全部已知数字后，点【计算概率】按钮计算
    </div>
    <table id="board"></table>
</div>
<script>
let R,C,totalDiamonds;
let grid = [];

// 全局触摸锁：只允许处理最先按下的单元格
let globalTouch = {
    active: false,
    targetY: -1,
    targetX: -1,
    timer: null,
    startX:0,
    startY:0,
    moveThreshold:5
};

// 初始化棋盘
function initBoard(r=+document.getElementById('rows').value, c=+document.getElementById('cols').value, td=+document.getElementById('totalDiam').value){
    R=r;C=c;totalDiamonds=td;
    // type:0空白,1=钻石💎,2=无钻石✕
    grid = Array(R).fill().map(()=> Array(C).fill({type:0,val:0,prob:null}));
    render();
}

// 清空棋盘，保留当前行列和钻石总数
function clearBoard(){
    grid = Array(R).fill().map(()=> Array(C).fill({type:0,val:0,prob:null}));
    render();
}

// 获取一个格子的8邻域
function getNeighbors(y,x){
    let ns=[];
    for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
            if(dy===0&&dx===0) continue;
            let ny=y+dy,nx=x+dx;
            if(ny>=0&&ny<R&&nx>=0&&nx<C) ns.push({y:ny,x:nx});
        }
    }
    return ns;
}

function render(){
    const tb = document.getElementById('board');
    tb.innerHTML = '';
    for(let y=0;y<R;y++){
        const tr = document.createElement('tr');
        for(let x=0;x<C;x++){
            // 修复闭包捕获BUG，锁定当前循环的y,x
            (function(cellY, cellX){
                const td = document.createElement('td');
                const cell = grid[cellY][cellX];
                if(cell.type===1){
                    td.className = 'diamond';
                    td.textContent='💎';
                }else if(cell.type===2){
                    td.className = 'empty';
                    td.textContent='✕';
                }else if(cell.val>0){
                    td.className='num';
                    td.textContent=cell.val;
                }else if(cell.prob!==null){
                    td.className='prob';
                    td.textContent=cell.prob.toFixed(2);
                }

                // 单击输入数字
                td.onclick = ()=>{
                    if(globalTouch.active) return;
                    if(grid[cellY][cellX].type!==0) return;
                    let v = prompt('输入相邻钻石数量','0');
                    v = parseInt(v);
                    if(!isNaN(v)) {
                        grid[cellY][cellX].val = v;
                        grid[cellY][cellX].prob = null;
                    }
                    render();
                }

                //双击标记【无钻石】红色叉号
                td.ondblclick = ()=>{
                    if(globalTouch.active) return;
                    const cell = grid[cellY][cellX];
                    if(cell.type === 2){
                        cell.type = 0;
                    }else{
                        cell.type = 2;
                    }
                    cell.prob = null;
                    render();
                }

                // 触摸按下
                td.addEventListener('touchstart',(e)=>{
                    if(globalTouch.active) return;
                    globalTouch.active = true;
                    globalTouch.targetY = cellY;
                    globalTouch.targetX = cellX;
                    const touch = e.touches[0];
                    globalTouch.startX = touch.clientX;
                    globalTouch.startY = touch.clientY;
                    // 启动长按计时器
                    globalTouch.timer = setTimeout(()=>{
                        toggleDiamond(cellY, cellX);
                    },500);
                },{passive:true});

                // 手指移动
                td.addEventListener('touchmove',(e)=>{
                    if(!globalTouch.active) return;
                    if(globalTouch.targetY !== cellY || globalTouch.targetX !== cellX) return;
                    const touch = e.touches[0];
                    const dx = touch.clientX - globalTouch.startX;
                    const dy = touch.clientY - globalTouch.startY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist > globalTouch.moveThreshold){
                        clearTimeout(globalTouch.timer);
                        globalTouch.timer = null;
                    }
                },{passive:true});

                // 手指抬起
                td.addEventListener('touchend',()=>{
                    if(globalTouch.targetY === cellY && globalTouch.targetX === cellX){
                        clearTimeout(globalTouch.timer);
                        resetGlobalTouch();
                    }
                });
                td.addEventListener('touchcancel',()=>{
                    if(globalTouch.targetY === cellY && globalTouch.targetX === cellX){
                        clearTimeout(globalTouch.timer);
                        resetGlobalTouch();
                    }
                });

                //电脑右键标记钻石
                td.oncontextmenu = (e)=>{
                    e.preventDefault();
                    toggleDiamond(cellY, cellX);
                }
                tr.appendChild(td);
            })(y,x);
        }
        tb.appendChild(tr);
    }
}

//重置全局触摸锁
function resetGlobalTouch(){
    globalTouch.active = false;
    globalTouch.targetY = -1;
    globalTouch.targetX = -1;
    globalTouch.timer = null;
}

//切换钻石标记
function toggleDiamond(y,x){
    const cell = grid[y][x];
    if(cell.type === 1){
        cell.type = 0;
    }else if(cell.type===0){
        cell.type =1;
    }
    cell.prob=null;
    render();
}

//带数字约束概率计算
function calcProb(){
    let markedDiamonds = 0;
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            if(grid[y][x].type===1) markedDiamonds++;
        }
    }
    const remainDiam = totalDiamonds - markedDiamonds;

    let unknownCells = [];
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            const cell = grid[y][x];
            if(cell.type===0 && cell.val===0){
                unknownCells.push({y,x});
                cell.prob=0;
            }else{
                cell.prob=null;
            }
        }
    }

    if(unknownCells.length <=0) {render();return;}
    let baseP = remainDiam / unknownCells.length;
    for(let pos of unknownCells){
        grid[pos.y][pos.x].prob = baseP;
    }

    //数字约束修正概率
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            const cell = grid[y][x];
            if(cell.val ===0) continue;
            const neighbors = getNeighbors(y,x);
            let fixedDiam=0;
            let unknownNear=[];
            for(let n of neighbors){
                const nc = grid[n.y][n.x];
                if(nc.type===1) fixedDiam++;
                else if(nc.type===0 && nc.val===0) unknownNear.push(n);
                else if(nc.type===2) continue;
            }
            const needDiam = cell.val - fixedDiam;
            if(unknownNear.length===0) continue;
            const p = needDiam / unknownNear.length;
            for(let n of unknownNear){
                grid[n.y][n.x].prob = p;
                if(p>=1) grid[n.y][n.x].type=1;
                else if(p<=0) grid[n.y][n.x].type=2;
            }
        }
    }
    render();
}

initBoard();
</script>
</body>
</html>
