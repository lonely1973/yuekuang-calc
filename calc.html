<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>月矿远征钻石计算器</title>
<style>
    * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
    }

    body {
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        padding: 6px;
        margin: 0;
        background: #f4f4f4;
        font-size: 14px;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        width: 100%;
    }

    .cfg {
        margin-bottom: 8px;
    }

    .cfg-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        margin-bottom: 6px;
    }

    .preset-buttons {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
    }

    .preset-buttons button {
        flex: 1;
        min-width: 0;
        padding: 7px 4px;
        font-size: 13px;
    }

    .custom-inputs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
    }

    .custom-inputs label {
        font-size: 13px;
    }

    .cfg input {
        width: 52px;
        padding: 5px 4px;
        font-size: 15px;
        text-align: center;
        border: 1px solid #bbb;
        border-radius: 4px;
        background: #fff;
    }

    .cfg .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
    }

    .cfg .btn-row button {
        flex: 1;
        min-width: 0;
        padding: 7px 4px;
        font-size: 13px;
    }

    .tip {
        font-size: 13px;
        color: #333;
        margin: 4px 0 8px;
        line-height: 1.4;
    }

    .action-bar {
        margin: 8px 0;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }

    .action-bar button {
        padding: 8px 6px;
        flex: 1;
        font-size: 14px;
        min-width: 0;
    }

    .hidden {
        display: none !important;
    }

    table {
        border-collapse: collapse;
        margin: 6px auto;
        width: 100%;
        table-layout: fixed;
    }

    td {
        border: 1px solid #999;
        text-align: center;
        font-weight: bold;
        background: #eee;
        transition: all 0.15s ease;
        position: relative;
        z-index: 0;
        padding:0;
        overflow:hidden;
    }
    /* 数字格子字号正常；概率格子单独缩小字体 */
    td.num {
        font-size:14px;
        background: #fff;
    }
    td.prob-low, td.prob-mid, td.prob-high {
        font-size: 9px; /* 概率字体缩小 */
    }

    /* 概率格子底色分级 */
    td.prob-low {
        background: #ffd8d8;
        color: #222;
    }

    td.prob-mid {
        background: #fff2aa;
        color: #222;
    }

    td.prob-high {
        background: #b8efb8;
        color: #222;
    }

    /* 选中格子：强蓝色外框 + 高亮底色 + 轻微放大 */
    td.selected {
        outline: 4px solid #0066ff;
        outline-offset: -3px;
        background: #cce4ff !important;
        transform: scale(1.12);
        box-shadow: 0 0 10px #0066ff;
        z-index: 10;
    }

    /* 冲突数字格子 红色底色 */
    td.num.conflict {
        background-color: #ff8888 !important;
        color: #000;
    }

    td.diamond {
        background: #73d073;
        color: #000;
        font-size:14px;
    }

    td.empty {
        background: #ff7777;
        color: #fff;
        font-size:14px;
    }
</style>
</head>
<body>
<div class="container">
    <div class="cfg">
        <div class="cfg-row preset-buttons">
            <button onclick="initBoard(8,8,20)">8×8｜20钻</button>
            <button onclick="initBoard(10,10,30)">10×10｜30钻</button>
            <button onclick="initBoard(12,12,45)">12×12｜45钻</button>
        </div>

        <div class="cfg-row custom-inputs">
            <label>自定义：</label>
            <label>行<input id="rows" value="10"></label>
            <label>列<input id="cols" value="10"></label>
            <label>钻石总数<input id="totalDiam" value="30"></label>
        </div>

        <div class="btn-row">
            <button onclick="initBoard()">创建</button>
            <button onclick="calcProb()">👉计算概率</button>
            <button onclick="clearBoard()">🗑️清空棋盘</button>
        </div>
    </div>

    <div class="tip" id="tipInfo">
        点击棋盘任意格子，再点“填入数字”。填入数字后才开始自动计算并显示概率。
    </div>

    <div class="action-bar hidden" id="operatePanel">
        <button onclick="inputNumber()">填入数字</button>
        <button onclick="setDiamond()">💎绿色钻石</button>
        <button onclick="setExclude()">✕红色排除</button>
        <button onclick="clearCell()">清除本格</button>
    </div>

    <table id="board"></table>
</div>

<script>
let R, C, totalDiamonds;
let grid = [];
let selectedY = -1;
let selectedX = -1;
let conflictCellList = [];
let hasNumberInput = false;

function initBoard(r = +document.getElementById('rows').value, c = +document.getElementById('cols').value, td = +document.getElementById('totalDiam').value) {
    R = r;
    C = c;
    totalDiamonds = td;
    grid = [];
    conflictCellList = [];
    selectedY = -1;
    selectedX = -1;
    hasNumberInput = false;

    for (let y = 0; y < R; y++) {
        let row = [];
        for (let x = 0; x < C; x++) {
            row.push({ type: 0, val: 0, prob: null });
        }
        grid.push(row);
    }

    hideOperatePanel();
    render();
}

function clearBoard() {
    grid = [];
    conflictCellList = [];
    selectedY = -1;
    selectedX = -1;
    hasNumberInput = false;

    for (let y = 0; y < R; y++) {
        let row = [];
        for (let x = 0; x < C; x++) {
            row.push({ type: 0, val: 0, prob: null });
        }
        grid.push(row);
    }

    hideOperatePanel();
    render();
}

function showOperatePanel() {
    document.getElementById("operatePanel").classList.remove("hidden");
}

function hideOperatePanel() {
    document.getElementById("operatePanel").classList.add("hidden");
}

function selectCell(y, x) {
    selectedY = y;
    selectedX = x;
    showOperatePanel();
    render();
}

function getNeighbors(y, x) {
    let ns = [];
    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            if (dy === 0 && dx === 0) continue;
            let ny = y + dy;
            let nx = x + dx;
            if (ny >= 0 && ny < R && nx >= 0 && nx < C) ns.push({ y: ny, x: nx });
        }
    }
    return ns;
}

function countMarkedDiamond() {
    let cnt = 0;
    for (let y = 0; y < R; y++) {
        for (let x = 0; x < C; x++) {
            if (grid[y][x].type === 1) cnt++;
        }
    }
    return cnt;
}

function checkAllBoardConflict() {
    let conflictList = [];
    for (let y = 0; y < R; y++) {
        for (let x = 0; x < C; x++) {
            const cell = grid[y][x];
            if (cell.val <= 0) continue;
            const neighbors = getNeighbors(y, x);
            let marked = 0;
            let unknown = 0;
            for (let p of neighbors) {
                const nc = grid[p.y][p.x];
                if (nc.type === 1) marked++;
                else if (nc.type === 0 && nc.val === 0) unknown++;
            }
            if (cell.val < marked || cell.val > marked + unknown) {
                conflictList.push({ y, x });
            }
        }
    }
    return conflictList;
}

function inputNumber() {
    const num = prompt("输入相邻钻石数量：", "");
    if (num === null) return;
    const n = parseInt(num);
    if (isNaN(n) || n < 0) {
        alert("输入错误！请输入≥0的整数");
        return;
    }

    const neighbors = getNeighbors(selectedY, selectedX);
    let marked = 0;
    let unknown = 0;
    for (let p of neighbors) {
        const cell = grid[p.y][p.x];
        if (cell.type === 1) marked++;
        else if (cell.type === 0 && cell.val === 0) unknown++;
    }

    if (n < marked) {
        alert(`逻辑冲突！\n周围已标记钻石：${marked}颗\n填入数字不能小于已标记钻石数量`);
        return;
    }
    if (n > marked + unknown) {
        alert(`逻辑冲突！\n周围最多只能容纳 ${marked + unknown}颗钻石\n你输入的${n}颗超出上限`);
        return;
    }

    grid[selectedY][selectedX].val = n;
    grid[selectedY][selectedX].type = 0;
    grid[selectedY][selectedX].prob = null;

    hasNumberInput = true;
    render();
    calcProb();
}

function setDiamond() {
    let tempCount = countMarkedDiamond() + 1;
    if (tempCount > totalDiamonds) {
        alert(`全局冲突！\n设定总钻石：${totalDiamonds}颗\n标记后总数将超过上限，无法标记`);
        return;
    }
    grid[selectedY][selectedX].type = 1;
    grid[selectedY][selectedX].val = 0;
    grid[selectedY][selectedX].prob = null;
    render();
    if (hasNumberInput) calcProb();
}

function setExclude() {
    grid[selectedY][selectedX].type = 2;
    grid[selectedY][selectedX].val = 0;
    grid[selectedY][selectedX].prob = null;
    render();
    if (hasNumberInput) calcProb();
}

function clearCell() {
    grid[selectedY][selectedX].type = 0;
    grid[selectedY][selectedX].val = 0;
    grid[selectedY][selectedX].prob = null;
    render();
    if (hasNumberInput) calcProb();
}

function render() {
    const tb = document.getElementById('board');
    tb.innerHTML = '';

    const screenWidth = Math.min(window.innerWidth - 12, 600);
    const maxCells = Math.max(R, C);
    let cellSize = Math.floor(screenWidth / maxCells);
    cellSize = Math.max(26, Math.min(40, cellSize));

    for (let y = 0; y < R; y++) {
        const tr = document.createElement('tr');
        for (let x = 0; x < C; x++) {
            const td = document.createElement('td');
            td.dataset.y = y;
            td.dataset.x = x;
            td.style.width = cellSize + 'px';
            td.style.height = cellSize + 'px';
            td.style.lineHeight = cellSize + 'px';

            const cell = grid[y][x];
            let isConflictCell = conflictCellList.some(item => item.y === y && item.x === x);

            if (cell.type === 1) {
                td.className = 'diamond';
                td.textContent = '💎';
            } else if (cell.type === 2) {
                td.className = 'empty';
                td.textContent = '✕';
            } else if (cell.val > 0) {
                td.className = isConflictCell ? 'num conflict' : 'num';
                td.textContent = cell.val;
            } else if (cell.prob !== null && hasNumberInput) {
                const percent = cell.prob * 100;
                td.textContent = percent.toFixed(1) + '%';
                if (percent > 50) {
                    td.className = 'prob-high';
                } else if (percent > 0) {
                    td.className = 'prob-mid';
                } else {
                    td.className = 'prob-low';
                }
            }

            if (y === selectedY && x === selectedX) {
                td.classList.add('selected');
            }

            td.onclick = function () {
                const cy = Number(this.dataset.y);
                const cx = Number(this.dataset.x);
                selectCell(cy, cx);
            };

            tr.appendChild(td);
        }
        tb.appendChild(tr);
    }
}

function calcProb() {
    let markedDiamonds = countMarkedDiamond();
    const remainDiam = totalDiamonds - markedDiamonds;

    let unknownCells = [];
    for (let y = 0; y < R; y++) {
        for (let x = 0; x < C; x++) {
            const cell = grid[y][x];
            if (cell.type === 0 && cell.val === 0) {
                unknownCells.push({ y, x });
                cell.prob = 0;
            } else {
                cell.prob = null;
            }
        }
    }

    if (unknownCells.length <= 0) {
        render();
        return;
    }

    let baseP = remainDiam / unknownCells.length;
    for (let pos of unknownCells) {
        grid[pos.y][pos.x].prob = baseP;
    }

    for (let y = 0; y < R; y++) {
        for (let x = 0; x < C; x++) {
            const cell = grid[y][x];
            if (cell.val === 0) continue;
            const neighbors = getNeighbors(y, x);
            let fixedDiam = 0;
            let unknownNear = [];
            for (let n of neighbors) {
                const nc = grid[n.y][n.x];
                if (nc.type === 1) fixedDiam++;
                else if (nc.type === 0 && nc.val === 0) unknownNear.push(n);
                else if (nc.type === 2) continue;
            }
            const needDiam = cell.val - fixedDiam;
            if (unknownNear.length === 0) continue;
            const p = needDiam / unknownNear.length;
            for (let n of unknownNear) {
                grid[n.y][n.x].prob = p;
                if (p >= 1) {
                    grid[n.y][n.x].type = 1;
                    grid[n.y][n.x].prob = null;
                } else if (p <= 0) {
                    grid[n.y][n.x].type = 2;
                    grid[n.y][n.x].prob = null;
                }
            }
        }
    }

    conflictCellList = checkAllBoardConflict();
    if (conflictCellList.length > 0) {
        alert(`⚠️ 棋盘检测到逻辑冲突！\n一共有${conflictCellList.length}处数字格子矛盾，请检查标红格子`);
    }
    render();
}

window.addEventListener('resize', function () {
    if (R && C) render();
});

initBoard();
</script>
</body>
</html>
