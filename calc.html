<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>月矿远征钻石计算器</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select:none;
            user-select:none;
            touch-action: manipulation;
        }
        body {
            font-family: system-ui;
            padding: 8px;
            margin: 0;
            background: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .cfg {
            margin-bottom: 10px;
        }
        .action-bar {
            margin: 10px 0;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .action-bar button {
            padding: 8px;
            flex: 1;
            font-size: 15px;
        }
        .hidden {
            display: none;
        }
        .tip {
            font-size: 14px;
            color: #333;
            margin: 6px 0;
        }
        .cfg input {
            width: 70px;
            padding: 4px;
            font-size: 16px;
        }
        button {
            padding: 6px 10px;
            font-size: 16px;
            margin: 2px;
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
        }
        td {
            width: 38px;
            height: 38px;
            border: 1px solid #999;
            text-align: center;
            font-size: 14px;
            background: #eee;
            transition: all 0.15s ease;
            position: relative;
            z-index: 0;
        }

        /* 概率格子基础样式 */
        td.prob {
            background: #fff2aa;
            font-weight: bold;
            font-size: 13px;
            color: #333;
        }

        /* 选中格子：强蓝色外框 + 高亮底色 + 轻微放大 */
        td.selected {
            outline: 4px solid #0066ff;
            outline-offset: -3px;
            background: #cce4ff !important;
            transform: scale(1.12);
            box-shadow: 0 0 10px #0066ff;
            z-index: 10;
        }

        td.num {
            background: #fff;
        }
        /* 冲突数字格子 红色底色 */
        td.num.conflict{
            background-color: #ff8888 !important;
            color:#000;
        }
        td.diamond {
            background: #73d073;
            color: #000;
        }
        td.empty {
            background: #ff7777;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="cfg">
        <div>预设地图：
            <button onclick="initBoard(8,8,20)">8×8｜20钻</button>
            <button onclick="initBoard(10,10,30)">10×10｜30钻</button>
            <button onclick="initBoard(12,12,45)">12×12｜45钻</button>
        </div>
        <div style="margin-top:4px">
            自定义：行<input id="rows" value="10">
            列<input id="cols" value="10">
            钻石总数<input id="totalDiam" value="30">
            <button onclick="initBoard()">创建</button>
            <button onclick="calcProb()">👉计算概率</button>
            <button onclick="clearBoard()">🗑️清空棋盘</button>
        </div>
    </div>

    <div class="tip" id="tipInfo">点击棋盘任意格子，然后使用下方按钮操作，修改棋盘后自动推演概率，也可手动点计算概率重算</div>
    <div class="action-bar hidden" id="operatePanel">
        <button onclick="inputNumber()">填入数字</button>
        <button onclick="setDiamond()">💎绿色钻石</button>
        <button onclick="setExclude()">✕红色排除</button>
        <button onclick="clearCell()">清除本格</button>
    </div>

    <table id="board"></table>
</div>
<script>
let R,C,totalDiamonds;
let grid = [];
let selectedY = -1;
let selectedX = -1;
let conflictCellList = []; //保存冲突坐标

// 初始化棋盘：双层循环创建独立对象，彻底解决引用共享bug
function initBoard(r=+document.getElementById('rows').value, c=+document.getElementById('cols').value, td=+document.getElementById('totalDiam').value){
    R=r;C=c;totalDiamonds=td;
    grid = [];
    conflictCellList = [];
    for(let y=0;y<R;y++){
        let row = [];
        for(let x=0;x<C;x++){
            row.push({type:0,val:0,prob:null});
        }
        grid.push(row);
    }
    selectedY=-1;selectedX=-1;
    hideOperatePanel();
    render();
    calcProb(); // 创建棋盘后自动计算一次
}

// 清空棋盘
function clearBoard(){
    grid = [];
    conflictCellList = [];
    for(let y=0;y<R;y++){
        let row = [];
        for(let x=0;x<C;x++){
            row.push({type:0,val:0,prob:null});
        }
        grid.push(row);
    }
    selectedY=-1;selectedX=-1;
    hideOperatePanel();
    render();
    calcProb(); //清空后自动计算
}

function showOperatePanel(){
    document.getElementById("operatePanel").classList.remove("hidden");
}
function hideOperatePanel(){
    document.getElementById("operatePanel").classList.add("hidden");
}

// 选中格子
function selectCell(y,x){
    selectedY = y;
    selectedX = x;
    showOperatePanel();
    render();
}

// 获取一个格子的8邻域
function getNeighbors(y,x){
    let ns=[];
    for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
            if(dy===0&&dx===0) continue;
            let ny=y+dy,nx=x+dx;
            if(ny>=0&&ny<R&&nx>=0&&nx<C) ns.push({y:ny,x:nx});
        }
    }
    return ns;
}

// 统计全局已标记钻石数量
function countMarkedDiamond(){
    let cnt = 0;
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            if(grid[y][x].type === 1) cnt++;
        }
    }
    return cnt;
}

// 全盘冲突检测函数，返回冲突坐标数组
function checkAllBoardConflict(){
    let conflictList = [];
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            const cell = grid[y][x];
            if(cell.val <= 0) continue;
            const neighbors = getNeighbors(y,x);
            let marked = 0;
            let unknown = 0;
            for(let p of neighbors){
                const nc = grid[p.y][p.x];
                if(nc.type ===1) marked++;
                else if(nc.type ===0 && nc.val ===0) unknown++;
            }
            if(cell.val < marked || cell.val > marked + unknown){
                conflictList.push({y,x});
            }
        }
    }
    return conflictList;
}

// 填入数字，增加冲突校验
function inputNumber(){
    const num = prompt("输入相邻钻石数量：","");
    if(num === null) return;
    const n = parseInt(num);
    if(isNaN(n) || n <0){
        alert("输入错误！请输入≥0的整数");
        return;
    }

    const neighbors = getNeighbors(selectedY,selectedX);
    let marked = 0;
    let unknown = 0;
    for(let p of neighbors){
        const cell = grid[p.y][p.x];
        if(cell.type === 1) marked++;
        else if(cell.type ===0 && cell.val ===0) unknown++;
    }
    //冲突判断
    if(n < marked){
        alert(`逻辑冲突！\n周围已标记钻石：${marked}颗\n填入数字不能小于已标记钻石数量`);
        return;
    }
    if(n > marked + unknown){
        alert(`逻辑冲突！\n周围最多只能容纳 ${marked + unknown}颗钻石\n你输入的${n}颗超出上限`);
        return;
    }

    grid[selectedY][selectedX].val = n;
    grid[selectedY][selectedX].type = 0;
    grid[selectedY][selectedX].prob = null;
    render();
    calcProb();
}

//标记钻石，增加全局钻石数量校验
function setDiamond(){
    //临时模拟标记，看总数是否超限
    let tempCount = countMarkedDiamond() + 1;
    if(tempCount > totalDiamonds){
        alert(`全局冲突！\n设定总钻石：${totalDiamonds}颗\n标记后总数将超过上限，无法标记`);
        return;
    }
    grid[selectedY][selectedX].type = 1;
    grid[selectedY][selectedX].val = 0;
    grid[selectedY][selectedX].prob = null;
    render();
    calcProb();
}

//标记排除
function setExclude(){
    grid[selectedY][selectedX].type = 2;
    grid[selectedY][selectedX].val = 0;
    grid[selectedY][selectedX].prob = null;
    render();
    calcProb();
}

//清除当前格子
function clearCell(){
    grid[selectedY][selectedX].type = 0;
    grid[selectedY][selectedX].val = 0;
    grid[selectedY][selectedX].prob = null;
    render();
    calcProb();
}

function render(){
    const tb = document.getElementById('board');
    tb.innerHTML = '';
    for(let y=0;y<R;y++){
        const tr = document.createElement('tr');
        for(let x=0;x<C;x++){
            const td = document.createElement('td');
            td.dataset.y = y;
            td.dataset.x = x;

            const cell = grid[y][x];
            let isConflictCell = conflictCellList.some(item=>item.y===y && item.x===x);

            if(cell.type===1){
                td.className = 'diamond';
                td.textContent = '💎';
            }else if(cell.type===2){
                td.className = 'empty';
                td.textContent = '✕';
            }else if(cell.val>0){
                td.className = isConflictCell ? 'num conflict' : 'num';
                td.textContent = cell.val;
            }else if(cell.prob!==null){
                td.className = 'prob';
                td.textContent = cell.prob.toFixed(2);
            }

            // 选中格子加蓝色高亮
            if(y === selectedY && x === selectedX){
                td.classList.add('selected');
            }

            td.onclick = function(){
                const cy = Number(this.dataset.y);
                const cx = Number(this.dataset.x);
                selectCell(cy, cx);
            }

            tr.appendChild(td);
        }
        tb.appendChild(tr);
    }
}

//【持续迭代概率计算函数】每次点击，全盘重新推算
function calcProb(){
    //1.统计已经手动标记的钻石
    let markedDiamonds = countMarkedDiamond();
    const remainDiam = totalDiamonds - markedDiamonds;

    //2.收集所有未知空白格子，清空旧概率
    let unknownCells = [];
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            const cell = grid[y][x];
            if(cell.type===0 && cell.val===0){
                unknownCells.push({y,x});
                cell.prob=0;
            }else{
                cell.prob=null;
            }
        }
    }

    if(unknownCells.length <=0) {render();return;}
    //基础全局平均概率
    let baseP = remainDiam / unknownCells.length;
    for(let pos of unknownCells){
        grid[pos.y][pos.x].prob = baseP;
    }

    //3.遍历所有数字格，根据数字约束，迭代修正周围格子概率（核心连续推算逻辑）
    for(let y=0;y<R;y++){
        for(let x=0;x<C;x++){
            const cell = grid[y][x];
            if(cell.val ===0) continue;
            const neighbors = getNeighbors(y,x);
            let fixedDiam=0;
            let unknownNear=[];
            for(let n of neighbors){
                const nc = grid[n.y][n.x];
                if(nc.type===1) fixedDiam++;
                else if(nc.type===0 && nc.val===0) unknownNear.push(n);
                else if(nc.type===2) continue;
            }
            const needDiam = cell.val - fixedDiam;
            if(unknownNear.length===0) continue;
            const p = needDiam / unknownNear.length;
            for(let n of unknownNear){
                grid[n.y][n.x].prob = p;
                // 强约束：概率1自动标记钻石；概率0自动标记排除
                if(p>=1){
                    grid[n.y][n.x].type=1;
                    grid[n.y][n.x].prob=null;
                }else if(p<=0){
                    grid[n.y][n.x].type=2;
                    grid[n.y][n.x].prob=null;
                }
            }
        }
    }

    //====全盘检测冲突，保存冲突格子坐标====
    conflictCellList = checkAllBoardConflict();
    if(conflictCellList.length>0){
        alert(`⚠️ 棋盘检测到逻辑冲突！\n一共有${conflictCellList.length}处数字格子矛盾，请检查标红格子`);
    }

    render();
}

initBoard();
</script>
</body>
</html>
